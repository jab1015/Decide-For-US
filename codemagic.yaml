workflows:
  ios-release:
    name: iOS Release Build

    environment:
      flutter: 3.24.5   # 🔥 STABLE VERSION THAT WORKS
      xcode: latest

      ios_signing:
        distribution_type: app_store
        bundle_identifier: com.decideforus.app

    integrations:
      app_store_connect: Codemagic

    scripts:
      - name: Clean project
        script: |
          flutter clean

      - name: Get Flutter packages
        script: |
          flutter pub get

      - name: Apply code signing
        script: |
          xcode-project use-profiles

      - name: Build IPA
        script: |
          flutter build ipa --release

    artifacts:
      - build/ios/ipa/*.ipa

    publishing:
      app_store_connect:
        auth: integration