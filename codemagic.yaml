workflows:
  ios-release:
    name: iOS Release Build
    max_build_duration: 60

    environment:
      flutter: stable
      xcode: latest
      cocoapods: default

    cache:
      cache_paths: []

    scripts:
      - name: Full clean (project + global CocoaPods)
        script: |
          flutter clean
          rm -rf ios/Pods
          rm -rf ios/Podfile.lock
          rm -rf ios/.symlinks
          rm -rf ios/Flutter/Flutter.framework
          rm -rf ios/Flutter/Flutter.podspec
          rm -rf ~/Library/Developer/Xcode/DerivedData

          # 🚨 CRITICAL: wipe CocoaPods global cache (THIS is the real fix)
          rm -rf ~/.cocoapods
          rm -rf ~/.cache/CocoaPods
          pod cache clean --all

      - name: Reinstall CocoaPods fresh
        script: |
          pod setup

      - name: Install Flutter deps
        script: |
          flutter pub get

      - name: Install Pods (clean install)
        script: |
          cd ios
          pod install --repo-update --clean-install

      - name: Build iOS
        script: |
          flutter build ios --release --no-codesign

    artifacts:
      - build/ios/ipa/*.ipa
      - build/ios/archive/*.xcarchive