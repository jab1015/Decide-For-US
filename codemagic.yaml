workflows:
  ios-release:
    name: iOS Release Build

    environment:
      flutter: stable
      xcode: latest

      ios_signing:
        distribution_type: app_store
        bundle_identifier: com.decideforus.app

    integrations:
      app_store_connect: Codemagic

    scripts:
      - name: Get Flutter packages
        script: |
          flutter pub get

      - name: Install Pods
        script: |
          cd ios
          pod install
          cd ..

      - name: 🔥 FORCE REMOVE -G FROM ALL BUILD SETTINGS
        script: |
          echo "Removing invalid -G flags everywhere..."

          find ios -name "*.pbxproj" -exec sed -i '' 's/-G//g' {} +

      - name: Apply code signing
        script: |
          xcode-project use-profiles

      - name: Build IPA
        script: |
          flutter build ipa --release

    artifacts:
      - build/ios/ipa/*.ipa

    publishing:
      app_store_connect:
        auth: integration