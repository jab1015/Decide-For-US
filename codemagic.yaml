workflows:
  ios-release:
    name: iOS Release Build

    environment:
      flutter: stable
      xcode: latest

      ios_signing:
        distribution_type: app_store
        bundle_identifier: com.decideforus.app

    integrations:
      app_store_connect: Codemagic

    scripts:
      - name: Clean project
        script: |
          flutter clean

      - name: Get packages
        script: |
          flutter pub get

      - name: Install pods
        script: |
          cd ios
          pod install
          cd ..

      - name: 🔥 FORCE REMOVE INVALID FLAGS AT BUILD TIME
        script: |
          export OTHER_CFLAGS="$(echo $OTHER_CFLAGS | sed 's/-G//g')"
          export OTHER_SWIFT_FLAGS="$(echo $OTHER_SWIFT_FLAGS | sed 's/-G//g')"

      - name: Apply code signing
        script: |
          xcode-project use-profiles

      - name: Build IPA
        script: |
          flutter build ipa --release

    artifacts:
      - build/ios/ipa/*.ipa

    publishing:
      app_store_connect:
        auth: integration