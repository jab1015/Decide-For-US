workflows:
  ios-release:
    name: iOS Release Build

    environment:
      flutter: stable
      xcode: latest

      ios_signing:
        distribution_type: app_store
        bundle_identifier: com.decideforus.app

    integrations:
      app_store_connect: Codemagic

    scripts:
      - name: Get Flutter packages
        script: |
          flutter pub get

      - name: Fix iOS invalid compiler flags
        script: |
          echo "Cleaning invalid compiler flags..."
          if [ -f ios/Flutter/Generated.xcconfig ]; then
            sed -i '' 's/-G//g' ios/Flutter/Generated.xcconfig || true
          fi
          if [ -f ios/Flutter/Release.xcconfig ]; then
            sed -i '' 's/-G//g' ios/Flutter/Release.xcconfig || true
          fi
          if [ -f ios/Flutter/Debug.xcconfig ]; then
            sed -i '' 's/-G//g' ios/Flutter/Debug.xcconfig || true
          fi

      - name: Apply code signing
        script: |
          xcode-project use-profiles

      - name: Build IPA
        script: |
          flutter build ipa --release

    artifacts:
      - build/ios/ipa/*.ipa

    publishing:
      app_store_connect:
        auth: integration