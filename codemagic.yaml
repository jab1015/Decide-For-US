workflows:
  ios-release:
    name: iOS Release Build
    max_build_duration: 60

    environment:
      flutter: 3.24.0   # 🔥 force modern Flutter
      xcode: latest

    cache:
      cache_paths:
        - $FLUTTER_ROOT/.pub-cache
        - ~/.pub-cache

    scripts:
      - name: Flutter clean
        script: |
          flutter clean

      - name: Get dependencies
        script: |
          flutter pub get

      - name: Build iOS (Flutter managed)
        script: |
          flutter build ipa --release

    artifacts:
      - build/ios/ipa/*.ipa