workflows:
  ios-release:
    name: iOS Release Build

    environment:
      flutter: stable
      xcode: 16.4

      ios_signing:
        distribution_type: app_store
        bundle_identifier: com.decideforus.app

    integrations:
      app_store_connect: Codemagic

    scripts:
      - name: Clean project
        script: |
          flutter clean

      - name: Get packages
        script: |
          flutter pub get

      - name: Install pods
        script: |
          cd ios
          pod install
          cd ..

      - name: 🔥 FORCE REMOVE INVALID FLAGS AT BUILD TIME
        script: |
          export OTHER_CFLAGS="$(echo $OTHER_CFLAGS | sed 's/-G//g')"
          export OTHER_SWIFT_FLAGS="$(echo $OTHER_SWIFT_FLAGS | sed 's/-G//g')"

      - name: Apply code signing
        script: |
          xcode-project use-profiles

      - name: Build IPA (Xcode direct - FINAL FIX)
  script: |
    flutter build ios --release --no-codesign

    cd ios

    xcodebuild -workspace Runner.xcworkspace \
      -scheme Runner \
      -configuration Release \
      -archivePath build/Runner.xcarchive \
      archive

    xcodebuild -exportArchive \
      -archivePath build/Runner.xcarchive \
      -exportOptionsPlist ExportOptions.plist \
      -exportPath build/ipa

    artifacts:
      - build/ios/ipa/*.ipa

    publishing:
      app_store_connect:
        auth: integration