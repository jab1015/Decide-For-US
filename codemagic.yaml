workflows:
  ios-release:
    name: iOS Release Build

    environment:
      flutter: stable
      xcode: latest

      ios_signing:
        distribution_type: app_store
        bundle_identifier: com.decideforus.app

    integrations:
      app_store_connect: Codemagic

    scripts:
      - name: Get Flutter packages
        script: |
          flutter pub get

      - name: Apply code signing
        script: |
          xcode-project use-profiles

      - name: Build IPA (override bad flags)
        script: |
          flutter build ipa --release -- \
            OTHER_CFLAGS="" \
            OTHER_SWIFT_FLAGS=""

    artifacts:
      - build/ios/ipa/*.ipa

    publishing:
      app_store_connect:
        auth: integration