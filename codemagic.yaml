workflows:
  ios-release:
    name: iOS App Store Release
    max_build_duration: 60

    integrations:
      app_store_connect: decide-for-us-apple

    environment:
      flutter: stable
      xcode: latest
      cocoapods: default
      vars:
        APP_STORE_APPLE_ID: 6760516571
      ios_signing:
        distribution_type: app_store
        bundle_identifier: com.decideforus.app

    scripts:
      - name: Get Flutter dependencies
        script: flutter pub get

      - name: Install iOS dependencies
        script: |
          cd ios
          pod install

      - name: Configure App Store signing
        script: xcode-project use-profiles

      - name: Build signed IPA
        script: |
          BUILD_NUMBER=$(($(app-store-connect get-latest-testflight-build-number "$APP_STORE_APPLE_ID") + 1))
          flutter build ipa --release \
            --build-name=1.0.29 \
            --build-number="$BUILD_NUMBER" \
            --dart-define=TESTER_PREMIUM_ACCESS=true \
            --export-options-plist=/Users/builder/export_options.plist
          ls build/ios/ipa/*.ipa >/dev/null

    artifacts:
      - build/ios/ipa/*.ipa

    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: true

  android-play-internal:
    name: Android Google Play Internal
    max_build_duration: 60

    environment:
      flutter: stable
      java: 17
      groups:
        - google_play_credentials
      android_signing:
        - Decide_Google

    scripts:
      - name: Get Flutter dependencies
        script: flutter pub get

      - name: Configure Android signing
        script: |
          cat > "$CM_BUILD_DIR/android/key.properties" <<EOF
          storePassword=$CM_KEYSTORE_PASSWORD
          keyPassword=$CM_KEY_PASSWORD
          keyAlias=$CM_KEY_ALIAS
          storeFile=$CM_KEYSTORE_PATH
          EOF

      - name: Analyze Flutter app
        script: flutter analyze

      - name: Build signed Android App Bundle
        script: |
          flutter build appbundle --release \
            --build-name=1.0.29 \
            --build-number=47 \
            --dart-define=TESTER_PREMIUM_ACCESS=true
          ls build/app/outputs/bundle/release/*.aab >/dev/null

    artifacts:
      - build/app/outputs/bundle/release/*.aab

    publishing:
      google_play:
        credentials: $GOOGLE_PLAY_SERVICE_ACCOUNT_CREDENTIALS
        track: internal
