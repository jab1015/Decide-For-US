workflows:
  ios-release:
    name: iOS Release Build

    environment:
      flutter: 3.24.0
      xcode: latest
      cocoapods: default

    scripts:
      - name: Clean
        script: flutter clean

      - name: Get packages
        script: flutter pub get

      # ✅ THIS is all you need for your setup
      - name: Apply code signing
        script: |
          xcode-project use-profiles

      - name: Build IPA
        script: |
          flutter build ipa --release

    artifacts:
      - build/ios/ipa/*.ipa