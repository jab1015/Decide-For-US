workflows:
  ios-release:
    name: iOS App Store Release
    max_build_duration: 60

    integrations:
      app_store_connect: decide-for-us-apple

    environment:
      flutter: stable
      xcode: latest
      cocoapods: default
      vars:
        APP_STORE_APPLE_ID: 6760516571
      ios_signing:
        distribution_type: app_store
        bundle_identifier: com.decideforus.app

    scripts:
      - name: Get Flutter dependencies
        script: flutter pub get

      - name: Install iOS dependencies
        script: |
          cd ios
          pod install

      - name: Configure App Store signing
        script: xcode-project use-profiles

      - name: Build signed IPA
        script: |
          BUILD_NUMBER=$(($(app-store-connect get-latest-testflight-build-number "$APP_STORE_APPLE_ID") + 1))
          flutter build ipa --release \
            --build-name=1.0.28 \
            --build-number="$BUILD_NUMBER" \
            --export-options-plist=/Users/builder/export_options.plist
          ls build/ios/ipa/*.ipa >/dev/null

    artifacts:
      - build/ios/ipa/*.ipa

    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: true
