workflows:
  ios-release:
    name: iOS Release Build

    environment:
      flutter: 3.24.0
      xcode: latest

    integrations:
      app_store_connect: Codemagic API key

    ios_signing:
      distribution_type: app_store
      bundle_identifier: com.decideforus.app

    scripts:
      - flutter clean
      - flutter pub get
      - flutter build ipa --release

    artifacts:
      - build/ios/ipa/*.ipa