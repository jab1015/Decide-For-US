workflows:
  ios-release:
    name: iOS Release Build

    environment:
      flutter: 3.24.0
      xcode: latest

    integrations:
      app_store_connect: Codemagic

    scripts:
      - name: Clean
        script: flutter clean

      - name: Get packages
        script: flutter pub get

      - name: Set up automatic signing
        script: |
          xcode-project use-profiles

      - name: Build IPA
        script: |
          flutter build ipa --release --no-codesign

    artifacts:
      - build/ios/ipa/*.ipa