workflows:
  ios-release:
    name: iOS Release Build

    environment:
      flutter: stable
      xcode: latest

      ios_signing:
        distribution_type: app_store
        bundle_identifier: com.decideforus.app

    integrations:
      app_store_connect: Codemagic

    scripts:
      - name: Get Flutter packages
        script: |
          flutter pub get

      - name: Build IPA with signing
        script: |
          xcode-project use-profiles
          flutter build ipa --release

    artifacts:
      - build/ios/ipa/*.ipa

    publishing:
      app_store_connect:
        auth: integration