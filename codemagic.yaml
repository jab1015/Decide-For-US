workflows:
  ios-release:
    name: iOS Release Build

    environment:
      flutter: stable
      xcode: latest

      ios_signing:
        distribution_type: app_store
        bundle_identifier: com.decideforus.app

    integrations:
      app_store_connect: Codemagic

    scripts:
      - name: Get Flutter packages
        script: |
          flutter pub get

      - name: Fix iOS compiler flags (PROJECT LEVEL)
        script: |
          echo "Removing invalid -G flags from Xcode project..."

          # Remove from project file
          sed -i '' 's/-G//g' ios/Runner.xcodeproj/project.pbxproj || true

          # Remove from Pods project if exists
          if [ -f ios/Pods/Pods.xcodeproj/project.pbxproj ]; then
            sed -i '' 's/-G//g' ios/Pods/Pods.xcodeproj/project.pbxproj || true
          fi

      - name: Apply code signing
        script: |
          xcode-project use-profiles

      - name: Build IPA
        script: |
          flutter build ipa --release

    artifacts:
      - build/ios/ipa/*.ipa

    publishing:
      app_store_connect:
        auth: integration