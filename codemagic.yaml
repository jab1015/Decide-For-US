workflows:
  ios-release:
    name: iOS Release Build

    environment:
      flutter: 3.24.0
      xcode: latest
      cocoapods: default

    scripts:
      - name: Clean
        script: flutter clean

      - name: Get packages
        script: flutter pub get

      - name: Fetch signing files
        script: |
          app-store-connect fetch-signing-files com.decideforus.app --type IOS_APP_STORE

      - name: Use signing files
        script: |
          xcode-project use-profiles

      - name: Build IPA
        script: |
          flutter build ipa --release

    artifacts:
      - build/ios/ipa/*.ipa