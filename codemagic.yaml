workflows:
  ios-release:
    name: iOS Release Build
    max_build_duration: 60

    environment:
      flutter: stable
      xcode: latest
      cocoapods: default

    cache:
      cache_paths: []

    scripts:
      - name: Clean project
        script: |
          flutter clean
          rm -rf ios/Pods
          rm -rf ios/.symlinks
          rm -rf ios/Flutter/Flutter.framework
          rm -rf ios/Flutter/Flutter.podspec
          rm -rf ~/Library/Developer/Xcode/DerivedData

      - name: Install Flutter dependencies
        script: |
          flutter pub get

      # 🔥 TEMPORARY STEP (NO --deployment)
      - name: Install Pods (REGENERATE LOCK)
        script: |
          cd ios
          pod install

      - name: Build iOS
        script: |
          flutter build ios --release --no-codesign

    artifacts:
      - ios/Podfile.lock
      - build/ios/ipa/*.ipa
      - build/ios/archive/*.xcarchive