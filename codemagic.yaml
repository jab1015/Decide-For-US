workflows:
  ios-release:
    name: iOS Release Build
    max_build_duration: 60

    environment:
      flutter: stable
      xcode: latest
      cocoapods: default

    cache:
      cache_paths:
        - ~/.pub-cache
        - ios/Pods

    scripts:
      - name: Clean project (FULL RESET)
        script: |
          echo "Cleaning project..."
          flutter clean
          rm -rf ios/Pods
          rm -rf ios/Podfile.lock
          rm -rf ~/Library/Developer/Xcode/DerivedData/*

      - name: Get dependencies
        script: |
          flutter pub get

      - name: Install CocoaPods
        script: |
          cd ios
          pod install
          cd ..

      - name: Validate Info.plist (CRITICAL)
        script: |
          echo "Checking CFBundlePackageType..."
          grep -q "CFBundlePackageType" ios/Runner/Info.plist || (echo "Missing CFBundlePackageType" && exit 1)

      - name: Set automatic build number
        script: |
          BUILD_NUMBER=$(date +%s)
          echo "Using build number: $BUILD_NUMBER"
          flutter build ipa --release --build-number=$BUILD_NUMBER

    artifacts:
      - build/ios/ipa/*.ipa

    publishing:
      app_store_connect:
        auth: integration