name: V2 Release Baseline

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  verify-v2-baseline:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Verify required V2 release files
        shell: bash
        run: |
          set -euo pipefail

          required_files=(
            "lib/screens/trip_planner_screen.dart"
            "lib/screens/trip_route_screen.dart"
            "lib/screens/trip_itinerary_screen.dart"
            "lib/screens/saved_trips_screen.dart"
            "lib/services/trip_route_service.dart"
            "lib/services/trip_plan_storage.dart"
            "lib/services/trip_itinerary_pacer.dart"
            "lib/models/trip_plan_draft.dart"
            "lib/models/trip_route.dart"
            "lib/screens/local_events_screen.dart"
            "lib/services/subscription_service.dart"
            "lib/services/forced_update_service.dart"
            "codemagic.yaml"
          )

          for file in "${required_files[@]}"; do
            if [[ ! -f "$file" ]]; then
              echo "ERROR: Required V2 release file is missing: $file"
              exit 1
            fi
          done

      - name: Verify Date Night+ UI and request wiring
        shell: bash
        run: |
          set -euo pipefail

          grep -q "bool isDateNight = false" lib/screens/decide_screen.dart
          grep -q "selectedDateOccasion" lib/screens/decide_screen.dart
          grep -q "selectedDateStyle" lib/screens/decide_screen.dart
          grep -q "selectedDateTiming" lib/screens/decide_screen.dart
          grep -q "Regular date" lib/screens/decide_screen.dart
          grep -q "First date" lib/screens/decide_screen.dart
          grep -q "Anniversary" lib/screens/decide_screen.dart
          grep -q "Surprise" lib/screens/decide_screen.dart
          grep -q "Romantic" lib/screens/decide_screen.dart
          grep -q "Playful" lib/screens/decide_screen.dart
          grep -q "Tonight" lib/screens/decide_screen.dart
          grep -q "isDateNight: isDateNight" lib/screens/decide_screen.dart
          grep -q "dateOccasion: selectedDateOccasion" lib/screens/decide_screen.dart
          grep -q "dateStyle: selectedDateStyle" lib/screens/decide_screen.dart
          grep -q "dateTiming: selectedDateTiming" lib/screens/decide_screen.dart
          grep -q "Date Night+ requires Premium" functions/index.js

      - name: Verify Local Events+ UI and backend wiring
        shell: bash
        run: |
          set -euo pipefail

          grep -q "local_events_screen.dart" lib/screens/decide_screen.dart
          grep -q "LocalEventsScreen" lib/screens/decide_screen.dart
          grep -q "_openLocalEvents" lib/screens/decide_screen.dart
          grep -q "class LocalEventsScreen" lib/screens/local_events_screen.dart
          grep -q "getLocalEvents" lib/screens/local_events_screen.dart
          grep -q "export const getLocalEvents" functions/index.js
          grep -q "Local Events+ requires Premium" functions/index.js
          grep -q "TICKETMASTER_API_KEY" functions/index.js

      - name: Verify Trip Planner+ UI, storage, and backend wiring
        shell: bash
        run: |
          set -euo pipefail

          grep -q "trip_planner_screen.dart" lib/screens/decide_screen.dart
          grep -q "TripPlannerScreen" lib/screens/decide_screen.dart
          grep -q "Trip Planner+" lib/screens/decide_screen.dart
          grep -q "class TripPlannerScreen" lib/screens/trip_planner_screen.dart
          grep -q "class TripRouteScreen" lib/screens/trip_route_screen.dart
          grep -q "class TripItineraryScreen" lib/screens/trip_itinerary_screen.dart
          grep -q "class SavedTripsScreen" lib/screens/saved_trips_screen.dart
          grep -q "saved_trip_plans" lib/services/trip_plan_storage.dart
          grep -q "export const resolveTripRoute" functions/index.js
          grep -q "export const discoverTripStops" functions/index.js

      - name: Verify Premium and tester protections
        shell: bash
        run: |
          set -euo pipefail

          grep -q "hasTesterBuildAccess(req)" functions/index.js
          grep -q "TESTER_PREMIUM_ACCESS" lib/services/subscription_service.dart
          grep -q "SubscriptionService.isSubscribed" lib/screens/decide_screen.dart

      - name: Verify release version is not stale
        shell: bash
        run: |
          set -euo pipefail
          version=$(grep '^version:' pubspec.yaml | awk '{print $2}')
          echo "Release baseline version: $version"
          if [[ -z "$version" ]]; then
            echo "ERROR: pubspec.yaml has no release version."
            exit 1
          fi

      - name: Verify Firebase Functions syntax
        run: node --check functions/index.js
