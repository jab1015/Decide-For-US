name: Date Night V2 Restore

on:
  push:
    branches: [restore/date-night-v2]

permissions:
  contents: write

jobs:
  restore:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - name: Apply scoped restore
        run: python3 .github/scripts/restore_date_night.py
      - name: Validate Flutter
        run: |
          flutter pub get
          flutter analyze
      - name: Validate functions
        run: node --check functions/index.js
      - name: Commit restoration
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add lib/screens/decide_screen.dart functions/index.js
          git diff --cached --check
          git commit -m "Restore Date Night V2 controls and matching [date-night-restore]"
          git push
